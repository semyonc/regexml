[package]
name = "regexml-fork"
version = "0.3.0"
edition = "2021"
rust-version = "1.85"
authors = ["Regexml contributors"]
license = "Apache-2.0 OR MPL-2.0"
description = "Unofficial, maintained fork of regexml: an XML Schema 1.1 / XPath compliant regular-expression engine"
documentation = "https://docs.rs/regexml-fork"
repository = "https://github.com/semyonc/regexml"
readme = "README.md"
keywords = ["regex", "xml", "xpath", "xml-schema"]
categories = ["text-processing"]

[dependencies]
ahash = "0.8.11"
enum_dispatch = "0.3.13"
icu_casemap = "1.5.1"
icu_collections = "1.5.0"
icu_properties = "1.5.1"

[dev-dependencies]
insta = { version = "1.42.2", features = ["yaml", "glob"] }
